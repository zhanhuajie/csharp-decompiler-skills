name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ApiLookup.sln

      - name: Build and test
        run: dotnet test ApiLookup.sln -c Release --no-restore --verbosity normal

      - name: Verify dotnet tool pack
        run: dotnet pack src/ApiLookup/ApiLookup.csproj -c Release -o pack-check

      - name: Verify single-file publish & prebuilt binary is in sync with source (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          dotnet publish src/ApiLookup/ApiLookup.csproj -c Release -r win-x64 --no-self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish-check
          function Get-BuildInfo([string]$exe) {
            $lines = & $exe --version --verbose
            if ($LASTEXITCODE -ne 0) { throw "$exe --version --verbose failed" }
            [pscustomobject]@{
              Version    = ($lines | Select-Object -First 1).Trim()
              SourceHash = (($lines | Where-Object { $_ -match '^source-hash:' }) -replace '^source-hash:\s*', '').Trim()
            }
          }
          $built = Get-BuildInfo ./publish-check/apilookup.exe
          $prebuilt = Get-BuildInfo ./csharp-definition-lookup/scripts/apilookup.exe
          Write-Host "Built:    $($built.Version) | source-hash $($built.SourceHash)"
          Write-Host "Prebuilt: $($prebuilt.Version) | source-hash $($prebuilt.SourceHash)"
          if ([string]::IsNullOrEmpty($built.SourceHash) -or $built.SourceHash -eq 'unknown') {
            throw "Fresh build did not embed a source hash."
          }
          if ($built.Version -ne $prebuilt.Version -or $built.SourceHash -ne $prebuilt.SourceHash) {
            throw "Prebuilt apilookup.exe is out of sync with source. Run .\tools\build.ps1 and commit the result."
          }

      - name: Verify single-file publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet publish src/ApiLookup/ApiLookup.csproj -c Release -r linux-x64 --no-self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish-check
          ./publish-check/apilookup --version --verbose

      - name: Install Native AOT prerequisites (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Verify Native AOT publish & smoke test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet publish src/ApiLookup/ApiLookup.csproj -c Release -r linux-x64 -p:PublishAot=true -p:StripSymbols=true -o publish-aot
          ./publish-aot/apilookup --version --verbose
          DLL=src/ApiLookup.Tests/bin/Release/net8.0/ApiLookup.Tests.dll
          ./publish-aot/apilookup index --db ./publish-aot/smoke.db --dll "$DLL"
          ./publish-aot/apilookup search "offscreen device" --db ./publish-aot/smoke.db --json > /dev/null
          ./publish-aot/apilookup show SampleNullability --db ./publish-aot/smoke.db --docs --inherited --ext > /dev/null
          ./publish-aot/apilookup hierarchy SampleBaseEntity --db ./publish-aot/smoke.db --json > /dev/null
          ./publish-aot/apilookup by-type SamplePipeSegment --db ./publish-aot/smoke.db --json > /dev/null
          ./publish-aot/apilookup locate SamplePipeSegment --dll "$DLL" --json > /dev/null

      - name: Verify Native AOT publish & smoke test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          dotnet publish src/ApiLookup/ApiLookup.csproj -c Release -r win-x64 -p:PublishAot=true -o publish-aot
          $exe = "./publish-aot/apilookup.exe"
          $dll = "src/ApiLookup.Tests/bin/Release/net8.0/ApiLookup.Tests.dll"
          & $exe --version --verbose; if ($LASTEXITCODE -ne 0) { throw "version failed" }
          & $exe index --db ./publish-aot/smoke.db --dll $dll; if ($LASTEXITCODE -ne 0) { throw "index failed" }
          & $exe search "offscreen device" --db ./publish-aot/smoke.db --json | Out-Null; if ($LASTEXITCODE -ne 0) { throw "search failed" }
          & $exe show SampleNullability --db ./publish-aot/smoke.db --docs --inherited --ext | Out-Null; if ($LASTEXITCODE -ne 0) { throw "show failed" }
          & $exe hierarchy SampleBaseEntity --db ./publish-aot/smoke.db --json | Out-Null; if ($LASTEXITCODE -ne 0) { throw "hierarchy failed" }
          & $exe by-type SamplePipeSegment --db ./publish-aot/smoke.db --json | Out-Null; if ($LASTEXITCODE -ne 0) { throw "by-type failed" }
          & $exe locate SamplePipeSegment --dll $dll --json | Out-Null; if ($LASTEXITCODE -ne 0) { throw "locate failed" }
